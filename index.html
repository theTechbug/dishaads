<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DISHA — Refined Stroke & Per-letter Shadows (Local Images)</title>

  <!-- Fonts: keep existing + new heading font (Rubik) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Elms+Sans:wght@400;700;900&family=Zalando+Sans+SemiExpanded:wght@400;700;900&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html,body{height:100%;margin:0;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;background:#fff;color:#111;}
    .hero{position:relative;width:100%;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000;}

    /* background carousel - adjusted so images always cover without jitter */
    .carousel-slide{
      position:absolute;
      inset:0;
      background-position:center center;
      background-size:cover;
      background-repeat:no-repeat;
      opacity:0;
      transition: opacity 1s ease-in-out;
      will-change: opacity;
      width:100%;
      height:100vh;
      transform: none;
    }
    .carousel-slide.show{ opacity:1; transform: none; }
    .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0.20), rgba(0,0,0,0.20));pointer-events:none;}

    /* bigger logo + pill */
    .logo{position:fixed;top:1.6rem;left:1.6rem;z-index:70;width:120px;height:120px;display:flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:0 14px 40px rgba(0,0,0,0.35);background: #fff ;overflow:hidden;}
    .logo img{width:100px;height:100px;object-fit:cover;display:block;border-radius:50%;}
    .top-pill{position:fixed;top:1.6rem;right:1.6rem;z-index:999;display:flex;gap:1rem;align-items:center;background:rgba(255,255,255,0.96);padding:0.75rem 1.2rem;border-radius:999px;box-shadow:0 14px 40px rgba(0,0,0,0.18);border:1px solid rgba(0,0,0,0.06);}
    .pill-btn{display:flex;align-items:center;gap:0.6rem;font-size:0.95rem;color:#111;text-decoration:none;}
    .pill-icon{width:20px;height:20px;display:block;opacity:0.98;}

    .hero-content{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;width:100%;pointer-events:none;padding:2rem;flex-direction:column;}

    .disha-wrap{display:inline-block;will-change:transform,opacity;transform:translateZ(0);backface-visibility:hidden;pointer-events:none;}
    .disha-scroll{display:inline-block;will-change:transform,opacity;transform-origin:center center;transition: transform 420ms cubic-bezier(.22,.9,.28,1), opacity 260ms ease;pointer-events:none;}

    .disha{
      margin:0;padding:0;font-weight:900;
      letter-spacing:-0.04em;
      text-align:center;
      font-size: clamp(60px, 15vw, 240px);
      line-height:0.86;
      position:relative; z-index:6;
      color: rgba(219, 200, 255, 0.14);
      -webkit-text-stroke: 0.9px rgba(255, 0, 0, 0.94);
      text-rendering:optimizeLegibility;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      pointer-events:auto; display:inline-block;
      text-shadow: 0 1px 4px rgba(255,255,255,0.04);
    }

    .d-letter{
      display:inline-block;
      transition: transform 240ms cubic-bezier(.2,.9,.3,1), filter 280ms cubic-bezier(.2,.9,.3,1);
      will-change: transform, filter;
      transform-origin:center center;
      color: white ;
      pointer-events:auto;
      margin:0;
      padding:5px;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .d-letter:nth-child(1) { text-shadow: -12px 28px 48px rgba(0,0,0,0.96); }
    .d-letter:nth-child(2) { text-shadow: -6px 24px 44px rgba(0,0,0,0.92); }
    .d-letter:nth-child(3) { text-shadow: 0 20px 42px rgba(0,0,0,0.98); }
    .d-letter:nth-child(4) { text-shadow: 6px 24px 44px rgba(0,0,0,0.92); }
    .d-letter:nth-child(5) { text-shadow: 12px 28px 48px rgba(0,0,0,0.96); }

    .d-letter:hover{
      transform: scale(1.05) translateZ(0);
      filter: drop-shadow(0 22px 48px rgba(0,0,0,0.96));
      z-index:200;
      animation: letterPop 320ms cubic-bezier(.2,.9,.3,1);
    }

    .d-letter:focus { outline: none; transform: scale(1.16); filter: drop-shadow(0 18px 44px rgba(0,0,0,0.58)); }

    @keyframes letterPop {
      0%   { transform: scale(1) translateY(0); }
      100% { transform: scale(1.05) translateY(0); }
    }

    @media (max-width:900px){
      .logo{width:92px;height:92px;top:1.2rem;left:1.2rem;}
      .logo img{width:76px;height:76px;}
      .top-pill{padding:0.6rem 1rem;gap:0.6rem;right:1.2rem;top:1.2rem;}
      .disha{font-size:clamp(48px, 18vw, 180px); -webkit-text-stroke:0.8px rgba(255,255,255,0.94);}
      .d-letter:nth-child(1){text-shadow:-8px 18px 36px rgba(0,0,0,0.48);}
      .d-letter:nth-child(5){text-shadow:8px 18px 36px rgba(0,0,0,0.48);}
    }
    @media (max-width:480px){
      .logo{width:76px;height:76px;top:1rem;left:1rem;}
      .logo img{width:62px;height:62px;}
      .top-pill{padding:0.5rem 0.9rem;gap:0.45rem;right:1rem;top:1rem;}
      .d-letter:hover{ transform: scale(1.12); animation: letterPopSmall 260ms cubic-bezier(.2,.9,.3,1); }
    }
    @keyframes letterPopSmall {
      0% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.16) translateY(-4px); }
      100% { transform: scale(1.12) translateY(-3px); }
    }

    @keyframes dishaZoomOut{0%{transform:scale(5.5) translateY(0);opacity:1;}100%{transform:scale(1) translateY(0);opacity:1;}}
    .animate-disha{animation:dishaZoomOut 900ms cubic-bezier(.22,.9,.28,1) forwards;transform-origin:center center;will-change:transform,opacity;}

    .below{padding:2.5rem;text-align:center;}

    /* handwritten subtitle */
    .handwritten-wrap{
      pointer-events:none;
      display:flex;
      justify-content:center;
      z-index:65;
      width:100%;
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      top: calc(90% + 1vh);
      pointer-events:none;
    }

    .handwritten {
      font-family: "Elms Sans", "Zalando Sans SemiExpanded", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight:700;
      font-size: clamp(34px, 6.8vw, 96px);
      color: rgba(255,255,255,0.98);
      letter-spacing:0.01em;
      display:inline-block;
      transform: translateY(6px);
      opacity:0;
      transition:opacity 220ms ease, transform 220ms ease;
      pointer-events:none;
      white-space:nowrap;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .hand-letter{
      display:inline-block;
      opacity:0;
      transform: translateY(10px) rotate(-4deg) scaleX(0.995);
      will-change: transform, opacity;
      transform: translateZ(0);
      font-family: inherit;
      font-weight: inherit;
      font-size: inherit;
      margin:0 0.02em;
      background: linear-gradient(180deg, #ffd75a 0%, #f2b42b 45%, #d79b19 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 1px 0 rgba(255,255,255,0.15), 0 8px 18px rgba(0,0,0,0.5);
    }
    .hand-letter.visible {
      transform: translateY(0) rotate(0deg) scaleX(1);
      opacity:1;
      transition: transform 360ms cubic-bezier(.2,.9,.3,1), opacity 260ms ease;
    }

    @media (max-width:900px){
      .handwritten { font-size: clamp(28px, 8vw, 70px); top: calc(50% + 8vh); }
    }
    @media (max-width:480px){
      .handwritten { font-size: clamp(20px, 12vw, 40px); top: calc(50% + 10vh); }
    }

    :root{
      --menu-bg: linear-gradient(135deg, rgba(0,0,0,0.55), rgba(0,0,0,0.72));
      --accent: #0c4750;
      --menu-z: 200;
    }
    .menu-panel{
      position:fixed; inset:0; z-index:var(--menu-z);
      background-image: linear-gradient(135deg, rgba(0,0,0,0.48), rgba(0,0,0,0.64)), url('1.jpg');
      background-size: cover;
      background-position: center;
      transform: translateY(-100%);
      transition: transform 520ms cubic-bezier(.22,.9,.28,1), opacity 300ms ease;
      will-change: transform;
      display:flex;
      align-items:center;
      pointer-events:none;
    }
    .menu-panel.open{ transform: translateY(0); pointer-events:auto; }

    .menu-left{
      width:min(46rem, 56%); min-width:320px;
      padding:5.5rem 6rem;
      display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
    }
    .menu-item{
      color: #ffffff; font-weight:900;
      font-size: clamp(18px, 6.5vw, 46px);
      padding: 10px;
      line-height:0.95; margin:.3rem 0; letter-spacing:-0.02em; text-transform:uppercase;
      cursor:pointer; user-select:none; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      transition: transform 220ms cubic-bezier(.2,.9,.3,1), opacity 180ms;
    }
    .menu-item:hover{ opacity:0.92;color: yellow; transform:translateX(15px); }

    .menu-right{ flex:1; min-width:180px; display:flex; align-items:center; justify-content:center; padding:4rem; }
    .side-arrow{
      position:absolute; left:-24px; top:50%; transform:translateY(-50%); z-index:calc(var(--menu-z) + 1);
      width:0; height:0; border-top:16px solid transparent; border-bottom:16px solid transparent;
      border-right:16px solid var(--accent); filter:drop-shadow(0 2px 0 rgba(0,0,0,0.12));
    }

    @media (max-width:900px){
      .menu-left{ padding:4rem 2.4rem; width:100%; }
      .menu-right{ display:none; }
      .menu-item{ font-size: clamp(28px, 9.6vw, 58px); }
    }

    .disha-scroll.scroll-zoom-active {
      transition: transform 380ms cubic-bezier(.22,.9,.28,1), opacity 260ms ease;
    }
    @media (prefers-reduced-motion: reduce) {
      .disha-scroll { transition: none !important; }
    }

    /* ----------------- NEW SECTION: Our Work tiles (masonry-like using CSS Grid) ----------------- */
    #work {
      position:relative;
      width:100%;
      height:100vh;
      overflow:hidden; /* NO scroll */
      background: linear-gradient(180deg, #0b0b0b 0%, #111 60%);
      color: #fff;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding: 3.2rem;
      box-sizing:border-box;
    }

    /* heading above grid: NO background as you requested */
    #work .section-heading {
      position:absolute;
      top:3rem;
      left:50%;
      transform:translateX(-50%);
      z-index:90;
      font-weight:700;
      font-size: clamp(22px, 3.6vw, 44px);
      letter-spacing: 0.04em;
      color: #ffffff;
      display:flex;
      gap:0.6rem;
      align-items:center;
      padding:0.25rem 0.5rem; /* small padding but no background */
      border-radius:8px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.55);
      font-family: "Rubik", "Elms Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      will-change: transform, opacity;
      /* start hidden above, subtle */
      transform: translateX(-50%) translateY(-18px);
      opacity: 0;
      transition: transform 560ms cubic-bezier(.22,.9,.28,1), opacity 420ms ease, filter 220ms ease;
    }

    /* visible state when scrolled into view */
    #work .section-heading.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      filter: drop-shadow(0 10px 28px rgba(0,0,0,0.45));
    }

    /* subtle hover effects for heading */
    #work .section-heading:hover {
      transform: translateX(-50%) translateY(5px) scale(1.50);
      text-shadow: 0 6px 18px rgba(0,0,0,0.45);
      color: darkolivegreen;
    }

    /* grid wrapper */
    .work-grid {
      width:100%;
      height: calc(100vh - 6.8rem);
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      grid-auto-rows: 78px;
      gap: 12px;
      align-content: start;
      padding-top: 6.8rem;
      box-sizing:border-box;
      z-index:10;
      grid-auto-flow: row dense;
    }

    .work-tile {
      position:relative;
      background-size:cover;
      background-position:center center;
      border-radius:10px;
      overflow:hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.03);
      transform-origin:center center;
      transition: transform 300ms cubic-bezier(.22,.9,.28,1), box-shadow 220ms ease;
      cursor: pointer;
      will-change: transform, opacity;
      display:block;
    }
    .work-tile:focus,
    .work-tile:hover{
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 18px 48px rgba(0,0,0,0.66);
      z-index:50;
    }

    /* sizes using grid span */
    .tile-s { grid-row: span 2; grid-column: span 1; }
    .tile-m { grid-row: span 3; grid-column: span 1; }
    .tile-l { grid-row: span 4; grid-column: span 2; }
    .tile-xl{ grid-row: span 5; grid-column: span 2; }

    .tile-caption {
      position:absolute;
      left:0; right:0; bottom:0;
      padding: 0.9rem 1rem;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 70%);
      color:#fff;
      font-weight:700;
      font-size: clamp(12px, 2.2vw, 18px);
      letter-spacing:0.01em;
      pointer-events:none;
    }

    /* subtle overlay on hover */
    .work-tile::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 10px;
      opacity: 0;
      box-shadow: 0 10px 40px rgba(0,0,0,0.70) inset;
      transition: opacity 990ms ease; 
    }
    .work-tile:hover::after, .work-tile:focus::after { opacity: 1; }

    /* ---------------- animation helpers for tiles (subtle Apple-like) ---------------- */
    /* initial prepared state (hidden + offset left/right) */
    .tile-anim {
      opacity: 0;
      will-change: transform, opacity;
      transform: translateZ(0);
    }
    .tile-anim[data-side="left"]  { transform: translateX(-18px) translateY(6px) scale(0.996); }
    .tile-anim[data-side="right"] { transform: translateX(18px) translateY(6px) scale(0.996); }

    /* revealed state */
    .tile-anim.reveal {
      opacity: 1;
      transform: translateX(0) translateY(0) scale(1);
      transition: transform 520ms cubic-bezier(.22,.9,.28,1), opacity 520ms ease;
    }

    @media (prefers-reduced-motion: reduce){
      .tile-anim, #work .section-heading { transform: none !important; transition: none !important; opacity: 1 !important; }
    }

    @media (max-width:900px){
      .work-grid { grid-auto-rows: 68px; gap:10px; padding-top:5.6rem; height: calc(100vh - 5.6rem); }
      .tile-l, .tile-xl { grid-column: span 2; }
    }
    @media (max-width:520px){
      .work-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); grid-auto-rows:60px; padding-top:5rem; gap:8px; height: calc(100vh - 5rem); }
      .tile-l, .tile-xl { grid-column: span 1; }
    }
  </style>
</head>
<body>
  <header class="hero" id="hero">
    <!-- carousel: local images from same directory -->
    <div class="carousel-slide" style="background-image:url('1.jpg');"></div>
    <div class="carousel-slide" style="background-image:url('2.jpg');"></div>
    <div class="carousel-slide" style="background-image:url('3.jpg');"></div>

    <!-- logo: local file logo.png -->
    <div class="logo" aria-hidden="true" title="DISHA logo">
      <img src="logo.png" alt="DISHA logo">
    </div>

    <!-- BIGGER pill nav -->
    <nav class="top-pill" aria-label="quick contact">
      <a class="pill-btn" href="tel:+0000000000" aria-label="Call">
        <svg class="pill-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.09 4.18 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.72c.12 1.01.4 2 .83 2.93a2 2 0 0 1-.45 2.11L8.91 10.91a16 16 0 0 0 6 6l1.15-1.15a2 2 0 0 1 2.11-.45c.92.43 1.92.71 2.93.83A2 2 0 0 1 22 16.92z"/></svg>
      </a>

      <a class="pill-btn" href="mailto:hello@example.com" aria-label="Email">
        <svg class="pill-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" ry="2"/><path d="M3 7l9 6 9-6"/></svg>
      </a>

      <!-- NOTE: we intentionally keep this anchor as-is and attach JavaScript to it (no other logic changed) -->
      <a class="pill-btn" href="#menu" aria-label="Menu" id="menuToggleAnchor">
        <svg class="pill-icon" id="menuToggleIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
      </a>
    </nav>

    <!-- HERO text: per-letter spans, tightened spacing (unchanged) -->
    <div class="hero-content">
      <div id="dishaWrap" class="disha-wrap" aria-hidden="true">
        <div class="disha-scroll" id="dishaScrollInner">
          <h1 class="disha" id="dishaText" aria-label="DISHA" role="heading" aria-level="1">
            <span class="d-letter" tabindex="0">D</span><span class="d-letter" tabindex="0">I</span><span class="d-letter" tabindex="0">S</span><span class="d-letter" tabindex="0">H</span><span class="d-letter" tabindex="0">A</span>
          </h1>
        </div>
      </div>

      <!-- Handwritten area added below title (positioned absolutely so it doesn't move DISHA) -->
      <div class="handwritten-wrap" aria-hidden="true">
        <div id="handwritten" class="handwritten" aria-hidden="true" aria-label="advertising"></div>
      </div>
    </div>

    <!-- NEW: Menu panel inserted here so it overlays the header (keeps other logic unchanged) -->
    <div id="mainMenu" class="menu-panel" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="side-arrow" aria-hidden="true"></div>
      <div class="menu-left" id="menuLeft">
        <nav aria-label="Main menu">
          <div class="menu-item" role="link" tabindex="0">Home</div>
          <div class="menu-item" role="link" tabindex="0">Work</div>
          <div class="menu-item" role="link" tabindex="0">Services</div>
          <div class="menu-item" role="link" tabindex="0">About</div>
          <div class="menu-item" role="link" tabindex="0">Contact</div>
        </nav>
      </div>
      <div class="menu-right" aria-hidden="true"></div>
    </div>
    <!-- END menu panel -->
  </header>

  <!-- ----------------- NEW: Our Work fullscreen tiles section (below hero) ----------------- -->
  <section id="work" aria-labelledby="workHeading" role="region">
    <h2 id="workHeading" class="section-heading">Our Work</h2>

    <div class="work-grid" id="workGrid" role="list" aria-label="Project tiles">
      <!-- tiles injected by JS to ensure random layout while using CSS Grid to avoid overlap -->
    </div>
  </section>
  <!-- ----------------------------------------------------------------------------- -->

  <main>
    
  </main>

  <script>
    // Background carousel (4s per slide) — unchanged
    (function(){
      const SLIDE_DURATION = 4000;
      const slides = Array.from(document.querySelectorAll('.carousel-slide'));
      if (!slides.length) return;
      let current = 0;
      slides.forEach((s,i)=> s.classList.toggle('show', i===0));
      setInterval(() => {
        slides[current].classList.remove('show');
        current = (current + 1) % slides.length;
        slides[current].classList.add('show');
      }, SLIDE_DURATION);
    })();

    // DISHA entrance animation: run once on initial load — unchanged
    (function(){
      const wrap = document.getElementById('dishaWrap');
      wrap.style.transform = "scale(5.5)";
      requestAnimationFrame(()=> {
        wrap.getBoundingClientRect();
        wrap.classList.add('animate-disha');
      });
    })();

    // promote hovered letter to its own layer for smoother transform — unchanged
    (function(){
      const letters = document.querySelectorAll('.d-letter');
      letters.forEach(letter => {
        letter.addEventListener('mouseenter', () => { letter.style.willChange = 'transform, filter'; });
        letter.addEventListener('mouseleave', () => { setTimeout(()=> letter.style.willChange = '', 400); });
      });
    })();

    // ---------- NEW: render and animate "advertising" AFTER DISHA animation ends (optimized) ----------
    (function(){
      const wrap = document.getElementById('dishaWrap');
      const dest = document.getElementById('handwritten');
      if (!wrap || !dest) return;

      wrap.addEventListener('animationend', () => {
        // small delay so the browser finishes the big zoom paint/composition
        setTimeout(() => {
          const text = "advertising";
          // build off-DOM to avoid layout thrash
          const frag = document.createDocumentFragment();
          Array.from(text).forEach((ch, i) => {
            const s = document.createElement('span');
            s.className = 'hand-letter';
            s.textContent = ch;
            // keep children hidden; we'll add 'visible' class staggered
            frag.appendChild(s);
          });
          dest.innerHTML = "";     // keep consistent with prior logic
          dest.appendChild(frag);  // single insertion (cheap)

          // reveal parent container
          requestAnimationFrame(() => {
            dest.style.opacity = '1';
            dest.style.transform = 'translateY(0)';
            // stagger the visible class to each child (non-blocking)
            const letters = Array.from(dest.children);
            letters.forEach((el, idx) => {
              setTimeout(() => el.classList.add('visible'), 120 + idx * 70);
            });
          });

        }, 120); // 120ms delay after animationend
      }, { once: true });
    })();
    // -------------------------------------------------------------------------------

    /* ----------------- NEW: Menu toggle JS (integrated without changing other logic) ----------------- */
    (function(){
      const menuPanel = document.getElementById('mainMenu');
      const menuAnchor = document.getElementById('menuToggleAnchor'); // the existing anchor in top-pill
      const menuIcon = document.getElementById('menuToggleIcon');

      if (!menuPanel || !menuAnchor || !menuIcon) return;

      // utility: set closed state
      function setClosedState(){
        menuPanel.classList.remove('open');
        menuPanel.setAttribute('aria-hidden','true');
        // set anchor aria-expanded
        menuAnchor.setAttribute('aria-expanded','false');
        menuAnchor.title = "Open menu";
        // hamburger markup
        menuIcon.setAttribute('viewBox','0 0 24 24');
        menuIcon.innerHTML = '<path d="M3 7h18M3 12h18M3 17h18"/>';
      }

      // utility: set open state
      function setOpenState(){
        menuPanel.classList.add('open');
        menuPanel.setAttribute('aria-hidden','false');
        menuAnchor.setAttribute('aria-expanded','true');
        menuAnchor.title = "Close menu";
        // cross markup
        menuIcon.setAttribute('viewBox','0 0 24 24');
        menuIcon.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';
      }

      // initial closed
      setClosedState();

      // when user clicks anchor, toggle menu
      menuAnchor.addEventListener('click', function(ev){
        ev.preventDefault();
        const isOpen = menuPanel.classList.contains('open');
        if (isOpen) setClosedState();
        else setOpenState();
      });

      // close with Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && menuPanel.classList.contains('open')) {
          setClosedState();
          menuAnchor.focus();
        }
      });

      // closing when clicking a menu item
      document.querySelectorAll('.menu-item').forEach(it => {
        it.addEventListener('click', () => {
          setClosedState();
        });
        it.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            it.click();
          }
        });
      });

      // keep focus management light — don't interfere with your other logic
    })();
    /* ---------------------------------------------------------------------------------------------------------------- */

    /* ----------------- NEW: Scroll-driven DISHA zoom-in (does not alter prior logic) ----------------- */
    (function(){
      const hero = document.getElementById('hero');
      const dishaInner = document.getElementById('dishaScrollInner'); // the inner wrapper that receives scroll transform
      const hand = document.getElementById('handwritten'); // subtitle container we now also drive on scroll
      if (!hero || !dishaInner) return;

      // configuration: how much scale to apply when hero scrolled away (max scale)
      const MAX_SCALE_INCREASE = 0.34; // final scale = 1 + this
      const MAX_TRANSLATE_Y_PX = -48;  // small upward nudge in px
      const EFFECT_SCROLL_PORTION = 0.65; // fraction of hero height over which effect completes (0..1)

      // subtitle scaling modifiers (we keep it subtler)
      const SUBTITLE_SCALE_FACTOR = 0.58;   // subtitle gets this fraction of DISHA scale
      const SUBTITLE_TRANSLATE_FACTOR = 0.36; // subtitle moves a fraction of DISHA translate

      // read-only flags
      let ticking = false;

      // compute and apply transform based on current hero position
      function updateTransform(){
        ticking = false;
        const rect = hero.getBoundingClientRect();
        const heroHeight = Math.max(rect.height, 1);
        // when user scrolls down, rect.top becomes negative
        // progress goes 0..1 as top moves from 0 .. -(EFFECT_SCROLL_PORTION * heroHeight)
        const progressRaw = Math.min(Math.max(-rect.top / (heroHeight * EFFECT_SCROLL_PORTION), 0), 1);
        // ease the progress slightly (use cubic ease-out)
        const easeProgress = 1 - Math.pow(1 - progressRaw, 3);

        const scale = 1 + (MAX_SCALE_INCREASE * easeProgress);
        const ty = MAX_TRANSLATE_Y_PX * easeProgress;

        // apply transform to DISHA inner wrapper (unchanged behaviour)
        dishaInner.style.transform = `translateZ(0) translateY(${ty}px) scale(${scale})`;

        // optionally slightly fade once out (subtle)
        const opacity = 1 - (0.08 * easeProgress);
        dishaInner.style.opacity = String(opacity);

        // --- NEW: also drive the subtitle (#handwritten) to follow the same motion but subtler ---
        if (hand) {
          // compute subtitle values scaled down
          const subScale = 1 + (MAX_SCALE_INCREASE * SUBTITLE_SCALE_FACTOR * easeProgress);
          const subTy = (MAX_TRANSLATE_Y_PX * SUBTITLE_TRANSLATE_FACTOR) * easeProgress;
          const subOpacity = 1 - (0.10 * easeProgress); // slight fade
          // apply composite transform; preserve existing translateY base by composing on top
          hand.style.transform = `translateZ(0) translateY(${subTy}px) scale(${subScale})`;
          hand.style.opacity = String(subOpacity);
        }
      }

      // scroll handler with rAF
      function onScrollOrResize(){
        if (!ticking){
          ticking = true;
          requestAnimationFrame(updateTransform);
        }
      }

      // register events (passive listener)
      window.addEventListener('scroll', onScrollOrResize, { passive: true });
      window.addEventListener('resize', onScrollOrResize, { passive: true });

      // also update initially in case user arrives mid-page
      updateTransform();

      // accessibility: if user prefers reduced motion, disable dynamic transform
      const media = window.matchMedia('(prefers-reduced-motion: reduce)');
      function handleReduceMotionChange() {
        if (media.matches) {
          // reset and remove handlers
          dishaInner.style.transform = '';
          dishaInner.style.opacity = '';
          if (hand) {
            hand.style.transform = '';
            hand.style.opacity = '';
          }
          window.removeEventListener('scroll', onScrollOrResize, { passive: true });
          window.removeEventListener('resize', onScrollOrResize, { passive: true });
        } else {
          // ensure update immediately
          updateTransform();
        }
      }
      media.addEventListener ? media.addEventListener('change', handleReduceMotionChange) : media.addListener(handleReduceMotionChange);
      handleReduceMotionChange();

    })();
    /* ---------------------------------------------------------------------------------------------------------------- */

    /* ----------------- NEW: Work grid generator (random tile sizes that FIT within the viewport; no scroll) ----------------- */
    (function(){
      const grid = document.getElementById('workGrid');
      const workSection = document.getElementById('work');
      if (!grid || !workSection) return;

      // local image list (replace with your actual images)
      const images = ['1.jpg','2.jpg','3.jpg','4.jpg','5.jpg'];

      // size buckets & weights (still random but we will ensure fit)
      const sizes = [
        { key: 's', cls: 'tile-s', weight: 40, spanX:1, spanY:2 },
        { key: 'm', cls: 'tile-m', weight: 35, spanX:1, spanY:3 },
        { key: 'l', cls: 'tile-l', weight: 18, spanX:2, spanY:4 },
        { key: 'xl',cls: 'tile-xl',weight: 7,  spanX:2, spanY:5 }
      ];

      function weightedPick(arr){
        const total = arr.reduce((s,i)=> s + i.weight, 0);
        let r = Math.random()*total;
        for (let i=0;i<arr.length;i++){
          r -= arr[i].weight;
          if (r <= 0) return arr[i];
        }
        return arr[arr.length-1];
      }
      function randChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

      // read computed row height and gap from CSS (fallbacks)
      function getGridMetrics(){
        const style = getComputedStyle(grid);
        // parse rows (px) and gap
        let rowPx = parseFloat(style.getPropertyValue('grid-auto-rows')) || 78;
        let gapPx = parseFloat(style.getPropertyValue('gap')) || parseFloat(style.getPropertyValue('grid-row-gap')) || 12;
        // padding-top accounted separately
        const paddingTop = parseFloat(style.getPropertyValue('padding-top')) || 0;
        return { rowPx, gapPx, paddingTop };
      }

      // compute how many columns will fit
      function computeCols() {
        const minTile = 220; // same as CSS min
        const cols = Math.max( Math.floor(grid.clientWidth / minTile), 1 );
        return cols;
      }

      // compute number of rows visible in the fixed grid height
      function computeRows(rowPx, gapPx, paddingTop) {
        // available height inside grid for tiles
        const available = Math.max(grid.clientHeight - paddingTop, 0);
        // each row occupies rowPx plus gap except last row; approximate using rowPx + gap
        const totalPerRow = rowPx + gapPx;
        // rows that can fit (ensure at least 2)
        const rows = Math.max(2, Math.floor((available + gapPx) / totalPerRow));
        return rows;
      }

      // occupancy matrix helpers
      function createEmptyOccupancy(rows, cols) {
        const occ = new Array(rows);
        for (let r=0;r<rows;r++){
          occ[r] = new Array(cols).fill(false);
        }
        return occ;
      }
      function fitsAt(occ, r, c, spanY, spanX) {
        const rows = occ.length, cols = occ[0].length;
        if (r + spanY > rows || c + spanX > cols) return false;
        for (let rr=r; rr<r+spanY; rr++){
          for (let cc=c; cc<c+spanX; cc++){
            if (occ[rr][cc]) return false;
          }
        }
        return true;
      }
      function markOcc(occ, r, c, spanY, spanX) {
        for (let rr=r; rr<r+spanY; rr++){
          for (let cc=c; cc<c+spanX; cc++){
            occ[rr][cc] = true;
          }
        }
      }

      // main placement: try to fill the visible grid fully but avoid overflow
      function placeTilesDeterministic() {
        grid.innerHTML = '';
        const { rowPx, gapPx, paddingTop } = getGridMetrics();
        const cols = computeCols();
        const rows = computeRows(rowPx, gapPx, paddingTop);

        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        grid.style.gridAutoRows = `${rowPx}px`;

        const occ = createEmptyOccupancy(rows, cols);

        const tiles = [];
        // we'll keep trying to place tiles until occupancy is full or we've attempted many times
        const maxAttempts = rows * cols * 8; // safe cap
        let attempts = 0;

        // helper to find first-fit spot scanning top-left to bottom-right
        function findSpot(spanX, spanY) {
          for (let r=0;r<rows;r++){
            for (let c=0;c<cols;c++){
              if (fitsAt(occ, r, c, spanY, spanX)) return {row:r,col:c};
            }
          }
          return null;
        }

        // Fill order: try larger tiles occasionally but always fallback to smaller if no space
        while (attempts < maxAttempts) {
          attempts++;
          // pick a size but bias to smaller sizes to improve fill
          let choice = weightedPick(sizes);
          // try to place; if doesn't fit, try progressively smaller choices
          let placed = false;
          const ordered = [choice].concat(sizes.filter(s => s.key !== choice.key));
          for (let cand of ordered) {
            if (cand.spanX > cols) continue;
            const spot = findSpot(cand.spanX, cand.spanY);
            if (!spot) continue;
            // create tile DOM
            const tile = document.createElement('div');
            tile.className = `work-tile ${cand.cls}`;
            tile.setAttribute('role','listitem');
            tile.setAttribute('tabindex','0');
            const img = randChoice(images);
            tile.style.backgroundImage = `url('${img}')`;
            const cap = document.createElement('div');
            cap.className = 'tile-caption';
            cap.textContent = `Project ${tiles.length + 1}`;
            tile.appendChild(cap);

            // set positioning (grid will respect spans)
            tile.style.gridColumn = `${spot.col + 1} / span ${cand.spanX}`;
            tile.style.gridRow = `${spot.row + 1} / span ${cand.spanY}`;
            tiles.push(tile);

            markOcc(occ, spot.row, spot.col, cand.spanY, cand.spanX);
            placed = true;
            break;
          }
          // if we couldn't place any candidate, break — grid likely full of holes that no size fits
          if (!placed) break;

          // stop early if occupancy is full
          let anyEmpty = false;
          for (let r=0;r<rows && !anyEmpty;r++){
            for (let c=0;c<cols;c++){
              if (!occ[r][c]) { anyEmpty = true; break; }
            }
          }
          if (!anyEmpty) break;
        }

        // final pass: fill remaining single-cell holes with 's' tiles
        for (let r=0;r<rows;r++){
          for (let c=0;c<cols;c++){
            if (!occ[r][c]) {
              // place a small tile (1x2) if possible (tile-s grid-row:span2)
              const spanX = 1, spanY = 2;
              if (fitsAt(occ, r, c, spanY, spanX)) {
                const tile = document.createElement('div');
                tile.className = `work-tile tile-s`;
                tile.setAttribute('role','listitem');
                tile.setAttribute('tabindex','0');
                const img = randChoice(images);
                tile.style.backgroundImage = `url('${img}')`;
                const cap = document.createElement('div');
                cap.className = 'tile-caption';
                cap.textContent = `Project ${tiles.length + 1}`;
                tile.appendChild(cap);
                tile.style.gridColumn = `${c + 1} / span ${spanX}`;
                tile.style.gridRow = `${r + 1} / span ${spanY}`;
                tiles.push(tile);
                markOcc(occ, r, c, spanY, spanX);
              }
            }
          }
        }

        // append tiles to DOM
        const frag = document.createDocumentFragment();
        tiles.forEach(t => frag.appendChild(t));
        grid.appendChild(frag);

        // add subtle entrance animation (original logic preserved)
        const added = Array.from(grid.children);
        added.forEach((t, idx) => {
          t.style.opacity = '0';
          t.style.transform = 'translateY(12px) scale(0.995)';
          setTimeout(() => {
            t.style.transition = 'transform 420ms cubic-bezier(.22,.9,.28,1), opacity 420ms ease';
            t.style.opacity = '1';
            t.style.transform = 'translateY(0) scale(1)';
          }, 80 + idx * 24);
        });
      }

      // initial render and re-render on resize (throttled)
      placeTilesDeterministic();
      let rt = null;
      window.addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(() => {
          placeTilesDeterministic();
        }, 140);
      }, { passive:true });

      // also update if fonts/images load and change layout a bit
      window.addEventListener('load', () => {
        setTimeout(placeTilesDeterministic, 120);
      });

      /* ----------------- NEW: scroll-based reveal for heading + tiles (subtle) ----------------- */
      function setupScrollReveal() {
        const heading = document.getElementById('workHeading');
        const gridEl = document.getElementById('workGrid');
        if (!heading || !gridEl) return;

        // prepare heading initial state is already set via CSS
        heading.classList.remove('visible');

        // prepare tiles: compute side (left/right) and add tile-anim class
        const tiles = Array.from(gridEl.children);
        if (tiles.length === 0) return;

        // compute grid center for side detection
        const gridRect = gridEl.getBoundingClientRect();
        const gridCenterX = gridRect.left + gridRect.width / 2;

        tiles.forEach(t => {
          // skip if already prepared
          if (!t.classList.contains('tile-anim')) {
            // compute bounding; fall back if not available
            let side = 'left';
            try {
              const tr = t.getBoundingClientRect();
              const tileCenterX = tr.left + tr.width / 2;
              side = (tileCenterX <= gridCenterX) ? 'left' : 'right';
            } catch (e) { side = 'left'; }
            t.dataset.side = side;
            t.classList.add('tile-anim');
          }
          // ensure starting inline styles from original logic won't prevent our class animations:
          // we leave inline styles alone (original logic) — our classes will apply when we add 'reveal'
        });

        // intersection observer -> reveal when section comes into view
        if ('IntersectionObserver' in window) {
          const io = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                // reveal heading from top (scroll-based)
                heading.classList.add('visible');

                // reveal tiles with subtle stagger; left from left, right from right
                const tilesNow = Array.from(gridEl.children);
                tilesNow.forEach((t, idx) => {
                  // compute small stagger based on row/idx to make it feel natural
                  const delay = 120 + (idx * 28);
                  // respect reduced motion: reveal instantly
                  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    t.classList.add('reveal');
                    return;
                  }
                  setTimeout(() => {
                    t.classList.add('reveal');
                  }, delay);
                });

                obs.unobserve(entry.target);
              }
            });
          }, { root: null, threshold: 0.12 });

          // observe the whole work section
          io.observe(workSection);
        } else {
          // fallback: reveal immediately with small stagger
          heading.classList.add('visible');
          tiles.forEach((t, idx) => setTimeout(()=> t.classList.add('reveal'), 80 + idx * 24));
        }
      }

      // run after initial layout and also after a small delay to allow original tile entrance to complete
      window.addEventListener('load', () => {
        // schedule reveal setup a bit later so original inline animation runs and we layer our subtle scroll-driven reveal
        setTimeout(setupScrollReveal, 180);
      });

      // also re-run on resize (recompute tile centers)
      let srT;
      window.addEventListener('resize', () => {
        clearTimeout(srT);
        srT = setTimeout(setupScrollReveal, 220);
      }, { passive: true });

    })();
    /* ---------------------------------------------------------------------------------------------------------------- */

  </script>
